<title>ALD 3차 모의고사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: single study column, sticky score bar on top, tap-to-answer cards grouped by topic */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --fg:#1b2428; --muted:#5d6b72; --line:#d5dde0;
  --accent:#1f6f78; --accent-soft:#e1eff0;
  --ok:#237a45; --ok-soft:#e3f3e8; --bad:#b23a3a; --bad-soft:#f8e4e4;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12181b; --surface:#1a2226; --fg:#e4ebed; --muted:#93a3a9; --line:#2c383d;
  --accent:#5fb7bf; --accent-soft:#1d3336; --ok:#6cc68d; --ok-soft:#1b3125; --bad:#ef8a8a; --bad-soft:#3a2224; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181b; --surface:#1a2226; --fg:#e4ebed; --muted:#93a3a9; --line:#2c383d;
  --accent:#5fb7bf; --accent-soft:#1d3336; --ok:#6cc68d; --ok-soft:#1b3125; --bad:#ef8a8a; --bad-soft:#3a2224; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px}
.bar-in{max-width:720px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar h1{font-size:16px;margin:0;font-weight:700}
.score{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);margin-left:auto}
.prog{flex-basis:100%;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.intro{color:var(--muted);font-size:14px;margin:14px 0 4px}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:28px 0 8px;font-weight:700}
.q{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:10px}
.q .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.q p.stem{margin:2px 0 10px;font-weight:500}
.opts{display:grid;gap:6px}
.opts.tf{grid-template-columns:1fr 1fr}
button.o{font:inherit;text-align:left;padding:10px 12px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;min-height:44px}
button.o:hover:not(:disabled){border-color:var(--accent)}
button.o:focus-visible,button.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.o:disabled{cursor:default}
button.o.right{background:var(--ok-soft);border-color:var(--ok);color:var(--fg)}
button.o.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--fg)}
.tf button.o{text-align:center;font-weight:700}
.exp{margin-top:10px;font-size:14px;padding:8px 10px;border-radius:6px;background:var(--accent-soft)}
.exp b.ok{color:var(--ok)} .exp b.bad{color:var(--bad)}
.model{white-space:pre-wrap;font-size:13.5px;background:var(--bg);border:1px dashed var(--line);border-radius:6px;padding:10px;margin-top:8px;overflow-x:auto}
button.act{font:inherit;font-weight:700;padding:10px 14px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--surface);cursor:pointer;min-height:44px}
button.act.ghost{background:transparent;color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
#result{background:var(--surface);border:2px solid var(--accent);border-radius:8px;padding:16px;margin-top:28px}
#result h3{margin:0 0 8px;font-size:18px}
.topics{display:grid;gap:6px;margin:10px 0}
.t{display:grid;grid-template-columns:7.5em 1fr 3.5em;gap:8px;align-items:center;font-size:14px}
.t .track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.t .track i{display:block;height:100%;background:var(--accent)}
.t .v{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
textarea{width:100%;min-height:90px;font-family:var(--mono);font-size:12.5px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px}
.note{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>

<header class="bar"><div class="bar-in">
  <h1>건축과경관디자인 · 3차 모의고사</h1>
  <span class="score" id="score">0 / 0 맞음 · 0문항 남음</span>
  <div class="prog"><i id="progbar"></i></div>
</div></header>

<div class="wrap">
  <p class="intro">시험 전 마지막 실전형입니다. 1–7주차 전체에서 냈습니다. 보기를 누르면 바로 채점되고 해설이 나옵니다. 서술형 뼈대는 종이에 먼저 써 본 뒤 "모범 뼈대 보기"를 누르고 스스로 채점하세요. 다 풀면 맨 아래 결과를 복사해서 Claude에게 보내 주세요.</p>
  <div id="quiz"></div>
  <section id="result">
    <h3 id="rtitle">결과</h3>
    <div class="topics" id="topics"></div>
    <p class="note" id="wronglist"></p>
    <textarea id="summary" readonly aria-label="Claude에게 보낼 결과 요약"></textarea>
    <div class="row">
      <button class="act" id="copy" type="button">결과 복사</button>
      <button class="act ghost" id="reset" type="button">처음부터 다시</button>
    </div>
    <p class="note" id="copymsg"></p>
  </section>
</div>

<script>
const Q=[
{t:"1주차",type:"mc",s:"Which is NOT one of the \"Wanted City\" qualities in the lecture?",o:["Lively","Safe","Sustainable","Monumental"],a:3,e:"Wanted City = Lively · Safe · Sustainable · Healthy. Monumental은 모더니즘 쪽 단어."},
{t:"1주차",type:"tf",s:"A sustainable city is strengthened if a large part of transport takes place as \"green mobility\": by foot, bike or public transport.",a:true,e:"슬라이드 문장 그대로."},
{t:"2주차",type:"mc",s:"Which of the following is a necessary activity?",o:["Strolling along a promenade","Sitting to enjoy the view","Waiting for the bus","Children playing"],a:2,e:"Necessary = 출근·등교·버스 기다리기. 산책·경치 = Optional, 아이들 놀이·대화 = Social."},
{t:"2주차",type:"mc",s:"\"People find furniture, corners, columns or niches within the edge zone that provide support for staying\" describes the:",o:["Edge effect","Piano effect","Proxemics","Affordance"],a:1,e:"Edge effect = 가장자리를 찾는다. Piano effect = 그 가장자리 안의 기댈 것(가구·기둥·벽감)."},
{t:"2주차",type:"tf",s:"Personal space is a fixed territory that does not change with activity or intimacy.",a:false,e:"Not fixed but changing: activity, sexuality, intimacy, circumstances, culture."},
{t:"2주차",type:"mc",s:"Hall's intimate distance ranges from:",o:["0–0.5 m","0.5–1.2 m","1.2–3.6 m","Over 3.6 m"],a:0,e:"껴안는 거리 0–0.5 m."},
{t:"2주차",type:"tf",s:"People are usually more generous with approaches from the sides than from the front.",a:true,e:"Personal reaction bubbles: 옆에서의 접근에 관대."},
{t:"3주차",type:"mc",s:"Which method gives \"a picture of a moment in a given place\" showing where people stand and sit?",o:["Tracing","Tracking","Mapping","Test walks"],a:2,e:"Mapping = 머무는 위치(stays)를 기호로. Tracing = 이동선."},
{t:"3주차",type:"mc",s:"Tracing aims to gather information such as:",o:["Walking speed with a stop-watch","Walking sequence, choice of direction and which entrances are used","People's job and income","Waiting times on a route walked by the observer"],a:1,e:"Tracing = 이동선. 속도 = Tracking, 직업 = 설문, 대기시간 = Test walks."},
{t:"3주차",type:"mc",s:"\"The spatial or pattern relation of the object to the observer and to other objects\" is Lynch's:",o:["Identity","Structure","Meaning","Legibility"],a:1,e:"Identity = 구별, Structure = 관계, Meaning = 의미."},
{t:"3주차",type:"mc",s:"A tower visible only from certain approaches, used as a point of reference, is a(n):",o:["Node","District","Landmark","Path"],a:2,e:"바라보는 점 = Landmark (\"primarily local, visible only in restricted localities\")."},
{t:"3주차",type:"tf",s:"According to Lynch, paths are the predominant elements in people's image of the city.",a:true,e:"슬라이드 문장 그대로."},
{t:"4주차",type:"mc",s:"In the lecture, urban design is defined as:",o:["The engineering of road capacity","The process of making better places for people than would otherwise be produced","The design of individual iconic buildings","Zoning land by single uses"],a:1,e:"\"the process of making better places for people than would otherwise be produced\"."},
{t:"4주차",type:"mc",s:"\"Character, History, Storytelling\" is the key aspect of:",o:["Enrich the Existing","Design for Change","Mix Uses and Forms","Make Connections"],a:0,e:"Enrich the Existing = 장소 고유의 정체성."},
{t:"4주차",type:"mc",s:"\"Quality of the public space, Continuity and Enclosure\" is the key aspect of:",o:["Work with the Landscape","Places for People","Manage the Investment","Make Connections"],a:1,e:"Places for People = safe, comfortable, varied, attractive."},
{t:"4주차",type:"tf",s:"A plaza is a public space associated with commercial buildings, usually with formal landscaping.",a:true,e:"Plaza = 상업. Square = civic, hard paved."},
{t:"4주차",type:"mc",s:"A greenway is:",o:["A formal civic space at a focal point","A network of footpath and cycle routes, often following streams or disused railways","A small area for children's play","Open space for soccer"],a:1,e:"Greenway = 보행·자전거 네트워크."},
{t:"4주차",type:"tf",s:"Le Corbusier's Contemporary City placed a high priority on pedestrianism and street life.",a:false,e:"반대. Towers in the park + highways → human scale forgotten."},
{t:"4주차",type:"mc",s:"Which is NOT a community function of streets?",o:["Ceremonial / symbolic space","Social space","Place of commerce","Freight distribution hub"],a:3,e:"Community function = Ceremonial · Social · Commerce · Outdoor room."},
{t:"5주차",type:"mc",s:"Which belongs to the pedestrian realm?",o:["Frontage zone","Bike lane","Landscaped median","Curbside parking"],a:0,e:"Pedestrian realm = Frontage · Walking · Landscape(furnishing) · Edge zone. 나머지는 Roadway realm."},
{t:"5주차",type:"mc",s:"For a \"convenient\" pedestrian street, people should not wait more than about ___ seconds to cross.",o:["5","10","30","60"],a:1,e:"10초."},
{t:"5주차",type:"mc",s:"Two curb extensions that create a pinch point are called:",o:["Chicane","Mid-block narrowing","Traffic circle","Diagonal diverter"],a:1,e:"Mid-block narrowing. Curb extension 하나 = 모서리 확장."},
{t:"5주차",type:"tf",s:"In a stepped approach, permanent materials are installed first and the public tests them later.",a:false,e:"Temporary 먼저 → public test → permanent."},
{t:"5주차",type:"mc",s:"A bioswale is:",o:["A raised crosswalk","A vegetated, shallow depression that captures, treats and infiltrates stormwater runoff","A type of bike rack","A paved traffic island"],a:1,e:"Bioswale = 빗물 처리 식재 저류지."},
{t:"7주차",type:"mc",s:"A minimum floor-to-floor height of 4.5 m on the ground floor mainly accommodates:",o:["Mezzanine offices","Vertical clearance required for loading spaces","Rooftop gardens","Underground parking"],a:1,e:"하역 공간 높이 → 리테일·상업 활동의 생존성."},
{t:"7주차",type:"tf",s:"Public entrances, such as shops or shared lobbies, should provide direct universal access flush with the public sidewalk.",a:true,e:"공공 = flush. 주거 = 0.9 m / 3 m."},
{t:"7주차",type:"mc",s:"A courtyard is landscaped open space located:",o:["Between the sidewalk and the main entrance","In the centre of a block with no direct street frontage","Along the sidewalk as a café zone","On a street corner as a plaza"],a:1,e:"Courtyard = 블록 중앙. Forecourt = 입구 앞."},
{t:"7주차",type:"mc",s:"The best location for seating is:",o:["In the middle of the main pedestrian flow","A protected spot outside the pedestrian zone, beneath a tree, with views of people walking by","Facing a blank wall for privacy","At the curb next to traffic"],a:1,e:"보호된 위치 + 나무 아래 + 사람 구경."},
{t:"7주차",type:"tf",s:"Mirrored glass on ground floor facades improves natural surveillance of the street.",a:false,e:"투명 유리가 surveillance·소통을 만든다. 미러는 안→밖만."},
{t:"인물",type:"mc",s:"\"Cities are the places where people meet to exchange ideas, trade, or simply relax and enjoy themselves.\"",o:["Jane Jacobs","Richard Rogers","Kevin Lynch","Le Corbusier"],a:1,e:"Richard Rogers."},
{t:"인물",type:"mc",s:"Which pair is correct?",o:["Hall – Affordance","Gibson – Affordance","Lynch – Proxemics","Gehl – The Image of the City"],a:1,e:"Gibson–Affordance · Hall–Proxemics · Lynch–Image of the City · Gehl–Cities for People."},
{t:"서술형",type:"self",s:"Explain proxemics and personal space, and how they apply to urban design. 뼈대 5칸을 종이에 먼저 쓰고 열어 보세요.",m:"① Proxemics = how people treat space & others in their proximity\n② Edward T. Hall, The Hidden Dimension (1966)\n③ Personal space = body buffer zone, portable territory; not fixed (activity, intimacy, culture)\n④ Intimate 0–0.5 / Personal 0.5–1.2 / Social 1.2–3.6 / Public >3.6 m; subway seats from ends, urinals far from door\n⑤ design seating spacing & public space scale to respect personal space"},
{t:"서술형",type:"self",s:"Explain Gehl's three types of outdoor activities and why good city quality matters. 뼈대 5칸을 먼저 쓰고 열어 보세요.",m:"① Outdoor activities in city space\n② Jan Gehl, Cities for People (2010)\n③ Necessary (all conditions) / Optional (need good quality) / Social (passive see-hear + active contact)\n④ going to work, waiting for bus / strolling, sitting to enjoy view / greetings, children playing\n⑤ good quality → more optional activities → more social activities → lively city (edge seating, active frontage)"}
];

const KEY="ald-quiz3-v1";
let ans={};
try{ans=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){ans={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ans))}catch(e){}};

const quiz=document.getElementById("quiz");
let lastTopic=null;
Q.forEach((q,i)=>{
  if(q.t!==lastTopic){const h=document.createElement("h2");h.textContent=q.t;quiz.appendChild(h);lastTopic=q.t}
  const c=document.createElement("div");c.className="q";c.id="q"+(i+1);
  c.innerHTML=`<span class="n">#${i+1}${q.type==="tf"?" · T/F":""}</span><p class="stem"></p>`;
  c.querySelector(".stem").textContent=q.s;
  const box=document.createElement("div");
  if(q.type==="self"){
    const show=document.createElement("button");show.className="act ghost";show.type="button";show.textContent="모범 뼈대 보기";
    box.appendChild(show);
    show.onclick=()=>{ans[i]=ans[i]??"shown";save();render(i)};
  }else{
    box.className="opts"+(q.type==="tf"?" tf":"");
    const opts=q.type==="tf"?["True","False"]:q.o;
    opts.forEach((txt,k)=>{
      const b=document.createElement("button");b.className="o";b.type="button";b.textContent=txt;
      b.onclick=()=>{if(ans[i]!==undefined)return;ans[i]=k;save();render(i)};
      box.appendChild(b);
    });
  }
  c.appendChild(box);
  const ex=document.createElement("div");ex.className="fb";c.appendChild(ex);
  quiz.appendChild(c);
});

function correctIdx(q){return q.type==="tf"?(q.a?0:1):q.a}
function isRight(i){const q=Q[i],v=ans[i];if(v===undefined)return null;if(q.type==="self")return v==="y"?true:v==="n"?false:null;return v===correctIdx(q)}

function render(i){
  const q=Q[i],c=document.getElementById("q"+(i+1)),fb=c.querySelector(".fb"),v=ans[i];
  fb.innerHTML="";
  if(q.type==="self"){
    if(v===undefined)return;
    c.querySelector("button.act").hidden=true;
    const m=document.createElement("div");m.className="model";m.textContent=q.m;fb.appendChild(m);
    const row=document.createElement("div");row.className="row";
    [["y","뼈대 5칸 거의 다 맞음"],["n","절반 이상 빠짐"]].forEach(([k,l])=>{
      const b=document.createElement("button");b.type="button";b.className="o"+(v===k?(k==="y"?" right":" wrong"):"");b.textContent=l;
      b.onclick=()=>{ans[i]=k;save();render(i)};row.appendChild(b)});
    fb.appendChild(row);
  }else{
    const bs=c.querySelectorAll("button.o"),ci=correctIdx(q);
    bs.forEach((b,k)=>{b.classList.remove("right","wrong");if(v!==undefined){b.disabled=true;if(k===ci)b.classList.add("right");else if(k===v)b.classList.add("wrong")}});
    if(v!==undefined){const ok=v===ci;const e=document.createElement("div");e.className="exp";
      e.innerHTML=`<b class="${ok?"ok":"bad"}">${ok?"정답":"오답"}</b> · `;e.appendChild(document.createTextNode(q.e));fb.appendChild(e)}
  }
  update();
}

function update(){
  let done=0,right=0;const per={};
  Q.forEach((q,i)=>{const r=isRight(i);per[q.t]=per[q.t]||{r:0,n:0};per[q.t].n++;if(r!==null){done++;if(r){right++;per[q.t].r++}}});
  document.getElementById("score").textContent=`${right} / ${done} 맞음 · ${Q.length-done}문항 남음`;
  document.getElementById("progbar").style.width=(done/Q.length*100)+"%";
  document.getElementById("rtitle").textContent=done===Q.length?`결과: ${right} / ${Q.length}`:`결과 (진행 중: ${done} / ${Q.length})`;
  const tp=document.getElementById("topics");tp.innerHTML="";
  Object.entries(per).forEach(([k,o])=>{const d=document.createElement("div");d.className="t";
    d.innerHTML=`<span></span><span class="track"><i style="width:${o.r/o.n*100}%"></i></span><span class="v">${o.r}/${o.n}</span>`;
    d.firstChild.textContent=k;tp.appendChild(d)});
  const wrong=Q.map((q,i)=>isRight(i)===false?i+1:null).filter(Boolean);
  document.getElementById("wronglist").textContent=wrong.length?`틀린 문항: #${wrong.join(", #")}`:"";
  const left=Q.map((q,i)=>isRight(i)===null?i+1:null).filter(Boolean);
  document.getElementById("summary").value=`3차 결과 ${right}/${Q.length}\n`+Object.entries(per).map(([k,o])=>`${k} ${o.r}/${o.n}`).join(" | ")+
    `\n틀린 문항: ${wrong.length?wrong.map(n=>"#"+n+"("+Q[n-1].t+")").join(", "):"없음"}`+(left.length?`\n미응답: #${left.join(", #")}`:"");
}

document.getElementById("copy").onclick=()=>{
  const t=document.getElementById("summary"),msg=document.getElementById("copymsg");
  const fallback=()=>{t.focus();t.select();msg.textContent="자동 복사가 안 돼서 결과를 선택해 두었어요. 길게 눌러 복사하세요."};
  try{navigator.clipboard.writeText(t.value).then(()=>{msg.textContent="복사했어요. Claude 대화창에 붙여넣어 보내 주세요."},fallback)}catch(e){fallback()}
};
let armed=false;
document.getElementById("reset").onclick=(ev)=>{
  if(!armed){armed=true;ev.target.textContent="정말 지울까요? 한 번 더 누르기";setTimeout(()=>{armed=false;ev.target.textContent="처음부터 다시"},3000);return}
  ans={};save();location.reload();
};
Q.forEach((q,i)=>render(i));update();
</script>
